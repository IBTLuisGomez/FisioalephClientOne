version: '3.5'

services:
  laravel-app:
    build:
      context: '.'
      args:
        uid: 123
    container_name: rehabilitat
    ports:
      - 8001:80
    environment:
      - APACHE_RUN_USER=#1000
      - APACHE_RUN_GROUP=#1000
    volumes:
      - .:/var/www/html
    networks:
      backend:
        aliases:
          - app

  mysql-db:
    image: mysql:5.7
    container_name: db_rehabilitat
    volumes:
      - ./run/var:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=apprehabilitat
      - MYSQL_USER=luis
      - MYSQL_PASSWORD=123465
    networks:
      backend:
        aliases:
          - mysql-db

networks:
  backend:
    name: backend-network