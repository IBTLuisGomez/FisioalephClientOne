version: '3.5'

services:
  laravel-app:
    build:
      context: './Dockerfile'
      args:
        uid: 123
    container_name: recuperat
    ports:
      - 8006:80
    environment:
      - APACHE_RUN_USER=#1000
      - APACHE_RUN_GROUP=#1000
    volumes:
      - .:/var/www/html
    networks:
      backend:
        aliases:
          - app

  mysql-db-recuperat:
    image: mysql:5.7
    container_name: recuperat_db
    volumes:
      - ./run/var:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=apprecuperat
      - MYSQL_USER=luis
      - MYSQL_PASSWORD=123465
    networks:
      backend:
        aliases:
          - mysql-db-recuperat

networks:
  backend:
    name: backend-network